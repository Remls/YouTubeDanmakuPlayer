<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0e1218">
<title>YouTube Danmaku Player</title>
<meta name="description" content="Watch YouTube videos with timestamped comments overlaid as they happen.">

<!-- Default OG tags; the edge function replaces these per-video on ?v= URLs -->
<meta property="og:type" content="website">
<meta property="og:title" content="YouTube Danmaku Player">
<meta property="og:description" content="Watch YouTube videos with timestamped comments overlaid as they happen.">
<meta property="og:image" content="https://yt.remls.io/icon-512.png">
<meta name="twitter:card" content="summary">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<!-- Installable PWA -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Danmaku">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ===== Landing ===== -->
<section id="landing" class="landing">
  <div class="landing-inner">
    <div class="brand">
      <img class="brand-mark" src="favicon.svg" alt="" width="30" height="30">
      <h1>YouTube Danmaku Player</h1>
    </div>
    <p class="tagline">YouTube, with timestamped comments overlaid as they happen.</p>

    <form id="watchForm">
      <div id="keySection" class="key-section" hidden>
        <label class="field-label" for="keyInput">YouTube API key</label>
        <input id="keyInput" class="landing-input" type="text" placeholder="AIza..." spellcheck="false" autocomplete="off">
        <p class="get-file">No key yet? <a href="https://github.com/Remls/YouTubeDanmakuPlayer#get-an-api-key" target="_blank" rel="noopener noreferrer">Get one in 3 minutes</a>.</p>
      </div>
      <p id="keySaved" class="key-saved" hidden><i class="ph ph-check-circle"></i> Key saved <a id="keyChange" href="#">change</a></p>

      <div id="deepPreview" class="deep-preview" hidden></div>

      <div id="urlSection">
        <label class="field-label" for="urlInput">Video</label>
        <input id="urlInput" class="landing-input" type="text" placeholder="Paste a link, or search YouTube" spellcheck="false" autocomplete="off">
      </div>
      <button id="watchBtn" class="btn watch-btn" type="submit"><i id="watchBtnIcon" class="ph ph-play"></i> <span id="watchBtnLabel">Watch</span></button>
    </form>

    <div id="bigWarn" class="big-warn" hidden>
      <p id="bigWarnText"></p>
      <div class="big-warn-actions">
        <button id="bigWarnGo" class="btn"><i class="ph ph-download-simple"></i> Load anyway</button>
        <button id="bigWarnCancel" class="btn secondary">Cancel</button>
      </div>
    </div>
    <p id="landingError" class="error" hidden></p>
    <p id="ytDirect" class="yt-direct" hidden><a id="ytLink" href="#"><i class="ph ph-youtube-logo"></i> Watch on YouTube instead</a></p>
    <div id="loadingBar" class="loading" hidden>
      <div class="spinner"></div>
      <span id="loadingText">Loading&hellip;</span>
    </div>

    <p class="repo-link"><a href="https://github.com/Remls/YouTubeDanmakuPlayer" target="_blank" rel="noopener noreferrer"><i class="ph ph-github-logo"></i> View source on GitHub</a></p>
  </div>
</section>

<!-- ===== Search results ===== -->
<section id="searchView" class="search-view" hidden>
  <div class="search-head">
    <button id="searchHome" class="icon-btn" title="Home"><i class="ph ph-house"></i></button>
    <form id="searchForm" class="search-form">
      <input id="searchInput" class="landing-input" type="search" placeholder="Search YouTube, or paste a link" spellcheck="false" autocomplete="off">
      <button class="btn" type="submit" title="Search"><i class="ph ph-magnifying-glass"></i></button>
    </form>
  </div>
  <p id="searchStatus" class="search-status" hidden></p>
  <div id="searchResults" class="search-results"></div>
  <div class="pager"><button id="searchMore" title="Uses ~100 API quota units" hidden>Load more</button></div>
</section>

<!-- ===== Main app ===== -->
<div id="app" class="app" hidden>
  <header class="topbar">
    <div class="topbar-left">
      <img class="brand-mark small" src="favicon.svg" alt="" width="22" height="22">
      <strong id="videoTitle"></strong>
    </div>
    <div class="topbar-right">
      <button id="dmToggle" class="icon-btn dm-btn active" title="Danmaku overlay" aria-pressed="true"><i class="ph ph-meteor"></i></button>
      <button id="btnMode" class="icon-btn" title="Theater view"><i class="ph ph-sidebar-simple"></i></button>
      <button id="btnFullscreen" class="icon-btn" title="Fullscreen"><i class="ph ph-corners-out"></i></button>
      <div class="copy-wrap">
        <button id="btnCopy" class="icon-btn" title="Copy link"><i class="ph ph-link"></i></button>
        <div id="copyMenu" class="copy-menu" hidden></div>
      </div>
      <button id="btnHome" class="icon-btn" title="New video"><i class="ph ph-plus"></i></button>
      <button id="btnSettings" class="icon-btn" title="Settings"><i class="ph ph-gear-six"></i></button>
    </div>
  </header>

  <div id="stageWrap" class="mode-default">
    <div id="stage">
      <div id="playerCol">
        <div id="playerBox">
          <div id="yt"></div>
          <div id="dmLayer"></div>
          <div id="timeOverlay" class="time-overlay" hidden></div>
        </div>
        <div id="fsControls" class="fs-controls">
          <button id="fsPanel" class="icon-btn" title="Hide comments"><i class="ph ph-caret-double-right"></i></button>
          <button id="fsExit" class="icon-btn" title="Exit fullscreen"><i class="ph ph-corners-in"></i></button>
          <button id="fsDm" class="icon-btn dm-btn active" title="Danmaku overlay" aria-pressed="true"><i class="ph ph-meteor"></i></button>
          <div class="copy-wrap">
            <button id="fsCopy" class="icon-btn" title="Copy link"><i class="ph ph-link"></i></button>
            <div id="fsCopyMenu" class="copy-menu" hidden></div>
          </div>
          <button id="fsSettings" class="icon-btn" title="Settings"><i class="ph ph-gear-six"></i></button>
        </div>
      </div>
      <aside id="panel">
        <div id="panelResize" class="panel-resize" title="Drag to resize"></div>
        <div id="panelBar"></div>
        <div id="panelList"></div>
        <button id="jumpLive" class="jump-live" hidden><i class="ph ph-arrow-down"></i> Jump to live</button>
      </aside>

      <!-- Settings page: inside #stage so it renders in fullscreen too;
           position: fixed keeps it viewport-wide everywhere else. -->
      <div id="settingsView" class="settings-view" hidden>
        <div class="settings-card">
          <div class="settings-head">
            <h2>Settings</h2>
            <button id="settingsClose" class="icon-btn" title="Close"><i class="ph ph-x"></i></button>
          </div>
          <div id="settingsBody"></div>
        </div>
      </div>
    </div>
    <section id="browser" class="view-root"></section>
  </div>
</div>

<script type="module" src="app/main.js"></script>
</body>
</html>
